<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stays</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <div class="bar-left">
      <div class="brand">Stays</div>
      <nav>
        <a href="." class="{{ 'on' if active == 'status' }}">Status</a>
        <a href="properties" class="{{ 'on' if active == 'properties' }}">Properties</a>
        <a href="staff" class="{{ 'on' if active == 'staff' }}">Staff</a>
        <a href="events" class="{{ 'on' if active == 'events' }}">Log</a>
        <a href="setup" class="{{ 'on' if active == 'setup' }}">Setup</a>
      </nav>
    </div>
    <div class="meta">
      <span><span class="dot {{ '' if last_sync else 'off' }}"></span>synced {{ last_sync or 'never' }}</span>
      <span>webhook {{ last_webhook or 'never' }}</span>
      <form method="post" action="sync" class="inline"><button>Sync now</button></form>
    </div>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
