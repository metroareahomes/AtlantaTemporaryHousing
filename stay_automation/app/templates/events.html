{% extends "base.html" %}{% set active = 'events' %}
{% block body %}
<div class="page-head"><h1>Log</h1></div>
<form method="get" action="events" class="toolbar" id="log-filters">
  <a class="chip {{ 'on' if not level }}" href="events?q={{ q|urlencode }}&amp;kind={{ kind|urlencode }}{% if property_id is not none %}&amp;property_id={{ property_id }}{% endif %}">All</a>
  <a class="chip {{ 'on' if level == 'error' }}" href="events?level=error&q={{ q|urlencode }}&amp;kind={{ kind|urlencode }}{% if property_id is not none %}&amp;property_id={{ property_id }}{% endif %}">Errors</a>
  <a class="chip {{ 'on' if level == 'warning' }}" href="events?level=warning&q={{ q|urlencode }}&amp;kind={{ kind|urlencode }}{% if property_id is not none %}&amp;property_id={{ property_id }}{% endif %}">Warnings</a>
  <select name="kind" aria-label="Event kind">
    <option value="">Every kind</option>
    {% for k in kinds %}<option value="{{ k }}" {{ 'selected' if k == kind }}>{{ k }}</option>{% endfor %}
  </select>
  <input type="hidden" name="level" value="{{ level }}">
  <select name="property_id" aria-label="Property">
    <option value="">All properties</option>
    {% for property in properties %}
    <option value="{{ property.id }}" {{ 'selected' if property.id == property_id }}>{{ property.name }}</option>
    {% endfor %}
  </select>
  <input aria-label="Search log" name="q" value="{{ q }}" placeholder="Home or message" type="search">
  <button type="submit">Filter</button>
</form>
<p id="log-filter-status" class="sub" role="status" hidden></p>
<div class="scroll">
<table>
  <thead><tr><th scope="col">Time</th><th scope="col">Property</th><th scope="col">Event</th></tr></thead>
  <tbody id="log-results">
  {% for e in events %}
    <tr class="lv-{{ e.level }}">
      <td class="sub nowrap">{{ e.at_local }}</td>
      <td>{% if e.property %}<a href="events?property_id={{ e.property_id }}">{{ e.property }}</a>{% endif %}</td>
      <td>{{ e.message }}<div class="sub">{{ e.kind }}</div></td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="sub">Nothing matches.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
<script>
(() => {
  const form = document.getElementById('log-filters');
  const results = document.getElementById('log-results');
  const status = document.getElementById('log-filter-status');
  let timer, pending;

  async function update() {
    clearTimeout(timer);
    pending?.abort();
    const request = new AbortController();
    pending = request;
    const url = new URL(form.action);
    for (const [name, value] of new FormData(form)) {
      if (value) url.searchParams.set(name, value);
    }
    status.hidden = false;
    status.textContent = 'Filtering activity…';
    try {
      const response = await fetch(url, {signal: request.signal, cache: 'no-store'});
      if (!response.ok) throw new Error('Filter request failed');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const rows = page.getElementById('log-results');
      if (!rows) throw new Error('Log results missing');
      if (request.signal.aborted) return;
      results.replaceChildren(...rows.children);
      const links = page.querySelectorAll('#log-filters a');
      form.querySelectorAll('a').forEach((link, index) => {
        link.setAttribute('href', links[index].getAttribute('href'));
      });
      history.replaceState(null, '', url);
      status.hidden = true;
    } catch (error) {
      if (!request.signal.aborted) status.textContent = 'Could not refresh the log. Tap Filter to try again.';
    }
  }

  form.elements.q.addEventListener('input', () => {
    pending?.abort();
    clearTimeout(timer);
    timer = setTimeout(update, 300);
  });
  form.querySelectorAll('select').forEach(select => select.addEventListener('change', update));
})();
</script>
{% endblock %}
