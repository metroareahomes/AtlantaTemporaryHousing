name: Stay Automation tests

on:
  push:
    branches:
      - fix/needs-attention-code-timing
  pull_request:
    paths:
      - 'stay_automation/**'
      - 'tests/**'
      - 'requirements-dev.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  scrolling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: python -m pip install playwright -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check scrolling and Save actions on desktop and phone
        run: python tests/browser/check_scrolling.py
      - name: Check daily temperature Setup on desktop and phone
        run: python tests/browser/check_daily_setup.py
      - name: Check email recipients and SMTP setup on desktop and phone
        run: python tests/browser/check_email_alerts.py
